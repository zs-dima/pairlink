# ignore: prefer-publish-to-none, this package is published.
name: pairlink
description: >
  Local-network pairing between two phones over TCP: an out-of-band secret, a nonce-bound
  HMAC handshake, replay rejection, heartbeats and takeover. Pure Dart.

version: 0.2.0

homepage: https://github.com/zs-dima/pairlink
repository: https://github.com/zs-dima/pairlink
issue_tracker: https://github.com/zs-dima/pairlink/issues

topics:
  - pairing
  - lan
  - tcp
  - hmac
  - mdns

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.13.2

dependencies:
  # HMAC-SHA256 for frame authentication and the HKDF session key.
  crypto: ^3.0.6
  meta: ^1.16.0

dev_dependencies:
  test: ^1.25.0

  lints_tool: ^1.0.1
